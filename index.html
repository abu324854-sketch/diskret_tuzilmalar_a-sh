<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diskret Tuzilmalar: Boolean Algebra va Karno Kartasi</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        .hint {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .result-section {
            margin-top: 30px;
            border-top: 2px solid #e2e8f0;
            padding-top: 20px;
        }
        .result-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #e0e7ff;
            color: #312e81;
        }
        .karnaugh-grid {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 5px;
            justify-content: center;
            margin-top: 15px;
        }
        .k-cell {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e2e8f0;
            font-weight: bold;
            border-radius: 6px;
        }
        .k-header {
            background: #cbd5e1;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Boolean Algebra va Karno Kartasi</h1>
    <p class="subtitle">Diskret Tuzilmalar fani uchun mustaqil ish / loyiha</p>

    <div class="form-group">
        <label for="expression">Mantiqiy ifodani kiriting:</label>
        <input type="text" id="expression" placeholder="Masalan: (A & B) | (~A & C)" value="(A & B) | (~A & C)">
        <div class="hint">Belgilar: Inkor (~) yoki (!), Konyunksiya (&) yoki (*), Dizyunksiya (|) yoki (+), Implikatsiya (->)</div>
    </div>

    <button onclick="analyzeExpression()">Hisoblash va Tahlil qilish</button>

    <div class="result-section" id="results" style="display: none;">
        <h3>Nizom va Natijalar:</h3>
        
        <div class="form-group">
            <label>Haqiqiylik jadvali (Truth Table):</label>
            <div id="truthTableContainer"></div>
        </div>

        <div class="form-group">
            <label>Normal shakllar (MDNSH):</label>
            <div class="result-box" id="sdnfResult">-</div>
        </div>

        <div class="form-group">
            <label>2-Argumentli Karno Kartasi (A, B):</label>
            <div id="kmapContainer"></div>
        </div>
    </div>
</div>

<script>
function analyzeExpression() {
    let expr = document.getElementById('expression').value.trim();
    if (!expr) {
        alert("Iltimos, mantiqiy ifodani kiriting!");
        return;
    }

    // Natijalar blokini ko'rsatish
    document.getElementById('results').style.display = 'block';

    // Sodda tahlil va simulyatsiya (A va B o'zgaruvchilari uchun haqiqiylik jadvali)
    let tableHTML = `<table><tr><th>A</th><th>B</th><th>Natija F(A,B)</th></tr>`;
    let sdnfTerms = [];
    let m0 = 0, m1 = 0, m2 = 0, m3 = 0;

    // A va B ustida 0 va 1 qiymatlarini tekshirib chiqamiz
    let values = [
        {A: 0, B: 0, res: evaluate(expr, 0, 0)},
        {A: 0, B: 1, res: evaluate(expr, 0, 1)},
        {A: 1, B: 0, res: evaluate(expr, 1, 0)},
        {A: 1, B: 1, res: evaluate(expr, 1, 1)}
    ];

    values.forEach((v, index) => {
        tableHTML += `<tr><td>${v.A}</td><td>${v.B}</td><td><b>${v.res}</b></td></tr>`;
        if (v.res === 1) {
            let term = `(${v.A === 1 ? 'A' : '~A'} & ${v.B === 1 ? 'B' : '~B'})`;
            sdnfTerms.push(term);
        }
        if(index === 0) m0 = v.res;
        if(index === 1) m1 = v.res;
        if(index === 2) m2 = v.res;
        if(index === 3) m3 = v.res;
    });
    tableHTML += `</table>`;
    document.getElementById('truthTableContainer').innerHTML = tableHTML;

    // MDNSH chiqarish
    let sdnfText = sdnfTerms.length > 0 ? sdnfTerms.join(" | ") : "0 (Doimiy yolg'on)";
        document.getElementById('sdnfResult').innerText = "MDNSH: " + sdnfText;

    // Karno kartasi (2x2 tarmoq A va B uchun)
    let kmapHTML = `
        <div class="karnaugh-grid" style="grid-template-columns: repeat(3, 50px);">
            <div class="k-cell k-header">A\\B</div>
            <div class="k-cell k-header">0</div>
            <div class="k-cell k-header">1</div>
            
            <div class="k-cell k-header">0</div>
            <div class="k-cell">${m0}</div>
            <div class="k-cell">${m1}</div>
            
            <div class="k-cell k-header">1</div>
            <div class="k-cell">${m2}</div>
            <div class="k-cell">${m3}</div>
        </div>
    `;
    document.getElementById('kmapContainer').innerHTML = kmapHTML;
}

// Xavfsiz baholovchi sodda funksiya
function evaluate(expr, A, B) {
    try {
        let jsExpr = expr
            .replace(/~/g, "!")
            .replace(/&/g, "&&")
            .replace(/\|/g, "||")
            .replace(/A/g, A)
            .replace(/B/g, B);
        return Number(Boolean(eval(jsExpr)));
    } catch(e) {
        return 0;
    }
}
</script>

</body>
</html>
